version: '3.8'

services:
  # Supabase local development
  supabase-db:
    image: supabase/postgres:15.8.1.020
    container_name: telev4-supabase-db
    ports:
      - '54322:5432'
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-api:
    image: supabase/gotrue:v2.167.0
    container_name: telev4-supabase-auth
    ports:
      - '54321:8080'
    environment:
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_SITE_URL: http://localhost:3001
      GOTRUE_DISABLE_SIGNUP: 'false'
    depends_on:
      supabase-db:
        condition: service_healthy

  # NestJS backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telev4-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      JWT_SECRET: local-development-secret-key
    depends_on:
      supabase-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  supabase-db-data:
